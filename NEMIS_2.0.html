<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>NEMIS 2.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#020609;
    color:#00eaff;
    font-family:Arial,sans-serif;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #063b46;
    background:#020b10;
}

.logo{
    font-size:20px;
    font-weight:bold;
    letter-spacing:3px;
    text-shadow:0 0 12px #00eaff;
}

.status{
    font-size:11px;
    color:#00ff88;
}

main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.hologram{
    width:280px;
    height:280px;
    border-radius:50%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(
        circle,
        rgba(0,234,255,.25),
        transparent 65%
    );
    box-shadow:
        0 0 40px rgba(0,234,255,.3);
}

.ring{
    position:absolute;
    border:1px solid #00eaff;
    border-radius:50%;
}

.r1{
    width:100%;
    height:100%;
    animation:girar 10s linear infinite;
}

.r2{
    width:78%;
    height:78%;
    border-style:dashed;
    animation:girar 7s linear reverse infinite;
}

.r3{
    width:55%;
    height:55%;
    animation:pulsar 2s infinite;
}

.core{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:
        0 0 20px #00eaff,
        0 0 60px #00eaff;
    animation:pulsar 2s infinite;
}

.panel{
    position:absolute;
    bottom:80px;
    width:90%;
    max-width:500px;
    border:1px solid #06434f;
    background:rgba(0,10,15,.85);
    padding:12px;
}

.log{
    height:90px;
    overflow:auto;
    font-size:12px;
    line-height:1.5;
}

.input-area{
    height:70px;
    display:flex;
    gap:8px;
    padding:10px;
    background:#020b10;
    border-top:1px solid #063b46;
}

input{
    flex:1;
    background:#031116;
    border:1px solid #07515f;
    color:#fff;
    padding:12px;
    border-radius:7px;
    outline:none;
}

button{
    background:#03212a;
    color:#00eaff;
    border:1px solid #00eaff;
    border-radius:7px;
    padding:0 15px;
}

@keyframes girar{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes pulsar{
    50%{
        transform:scale(1.08);
        opacity:.7;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">NEMIS 2.0</div>
    <div class="status" id="status">
        SISTEMA ONLINE
    </div>
</header>

<main>

    <div class="hologram">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="core"></div>
    </div>

    <div class="panel">
        <div class="log" id="log">
            NEMIS 2.0 inicializada...
        </div>
    </div>

</main>

<div class="input-area">

    <input
        id="comando"
        placeholder="Digite um comando para a NEMIS..."
    >

    <button onclick="ouvir()">
        🎙️
    </button>

    <button onclick="enviar()">
        ENVIAR
    </button>

</div>

</div>

<script>

/*
==================================================
NEMIS 2.0
WEBHOOK DO N8N
==================================================

COLOQUE A URL DO SEU WEBHOOK AQUI.
*/

const N8N_WEBHOOK_URL =
"COLE_AQUI_A_URL_DO_N8N";


function registrar(texto){

    const log =
        document.getElementById("log");

    const linha =
        document.createElement("div");

    linha.textContent = texto;

    log.prepend(linha);
}


async function enviar(){

    const campo =
        document.getElementById("comando");

    const comando =
        campo.value.trim();

    if(!comando){
        return;
    }

    campo.value = "";

    registrar(
        "VOCÊ: " + comando
    );

    /*
    ==============================================
    TESTE LOCAL
    ==============================================
    */

    if(
        N8N_WEBHOOK_URL.includes(
            "COLE_AQUI"
        )
    ){

        registrar(
            "NEMIS: Webhook ainda não configurado."
        );

        falar(
            "O webhook do n8n ainda não foi configurado."
        );

        return;
    }


    document.getElementById("status")
        .textContent =
        "CONECTANDO AO N8N...";


    try{

        const resposta =
            await fetch(
                N8N_WEBHOOK_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        command:comando,

                        message:comando,

                        source:
                        "NEMIS_2.0",

                        language:
                        "pt-BR",

                        timestamp:
                        new Date()
                        .toISOString()

                    })
                }
            );


        if(!resposta.ok){

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        const dados =
            await resposta.json();


        const respostaNEMIS =
            dados.response ||
            dados.answer ||
            dados.message ||
            "Comando recebido.";


        registrar(
            "NEMIS: " +
            respostaNEMIS
        );


        falar(
            respostaNEMIS
        );


        document.getElementById("status")
            .textContent =
            "N8N ONLINE";


    }catch(erro){

        console.error(erro);

        registrar(
            "NEMIS: Erro na conexão com o n8n."
        );

        falar(
            "Não consegui conectar ao n8n."
        );

        document.getElementById("status")
            .textContent =
            "ERRO N8N";
    }

}


/*
==================================================
VOZ
==================================================
*/

let reconhecimento;


if(
    "webkitSpeechRecognition"
    in window
){

    reconhecimento =
        new webkitSpeechRecognition();

    reconhecimento.lang =
        "pt-BR";

    reconhecimento.continuous =
        false;

    reconhecimento.interimResults =
        false;


    reconhecimento.onresult =
        function(event){

            const texto =
                event.results[0][0]
                .transcript;

            document.getElementById(
                "comando"
            ).value = texto;

            enviar();

        };

}


function ouvir(){

    if(reconhecimento){

        reconhecimento.start();

    }else{

        falar(
            "Reconhecimento de voz não disponível."
        );

    }

}


/*
==================================================
RESPOSTA POR VOZ
==================================================
*/

function falar(texto){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    speechSynthesis.cancel();

    const voz =
        new SpeechSynthesisUtterance(
            texto
        );

    voz.lang =
        "pt-BR";

    voz.rate =
        0.95;

    voz.pitch =
        1;

    speechSynthesis.speak(
        voz
    );

}

</script>

</body>
</html>
