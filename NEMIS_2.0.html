<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#020609">
<title>NEMIS 2.0 — Holographic AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#020609;
    color:#00eaff;
    font-family:Arial,sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);
    background-size:30px 30px;
    pointer-events:none;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid rgba(0,234,255,.3);
    background:rgba(0,8,12,.85);
}

.logo{
    font-size:20px;
    font-weight:bold;
    letter-spacing:4px;
    text-shadow:0 0 15px #00eaff;
}

.status{
    font-size:10px;
    color:#00ff88;
    display:flex;
    align-items:center;
    gap:7px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#00ff88;
    box-shadow:0 0 12px #00ff88;
}

main{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hud{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.hud-left,
.hud-right{
    position:absolute;
    top:25px;
    font-size:9px;
    line-height:1.8;
    color:#50dbea;
    opacity:.8;
}

.hud-left{
    left:12px;
}

.hud-right{
    right:12px;
    text-align:right;
}

.hologram{
    width:min(82vw,390px);
    height:min(82vw,390px);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(0,234,255,.75);
    box-shadow:
    0 0 20px rgba(0,234,255,.2),
    inset 0 0 20px rgba(0,234,255,.08);
}

.ring1{
    inset:2%;
    animation:spin 12s linear infinite;
}

.ring2{
    inset:9%;
    border-style:dashed;
    animation:spinReverse 17s linear infinite;
}

.ring3{
    inset:18%;
    animation:spin 8s linear infinite;
}

.ring4{
    inset:27%;
    border-color:rgba(0,234,255,.35);
    animation:pulse 2s infinite;
}

.energy{
    position:absolute;
    width:55%;
    height:55%;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(0,234,255,.35),
        rgba(0,130,180,.12),
        transparent 70%
    );
    box-shadow:
    0 0 40px rgba(0,234,255,.4),
    0 0 100px rgba(0,234,255,.15);
    animation:pulse 2.5s infinite;
}

.hologram-image{
    position:absolute;
    width:48%;
    height:48%;
    object-fit:contain;
    border-radius:50%;
    opacity:.9;
    filter:
    drop-shadow(0 0 10px #00eaff)
    drop-shadow(0 0 30px #00eaff);
    mix-blend-mode:screen;
}

.core{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:
    0 0 15px #00eaff,
    0 0 40px #00eaff,
    0 0 80px rgba(0,234,255,.7);
    animation:corePulse 1.5s infinite;
}

.scan{
    position:absolute;
    width:80%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        #00eaff,
        transparent
    );
    box-shadow:0 0 15px #00eaff;
    animation:scan 3s infinite;
}

.radar{
    position:absolute;
    bottom:25px;
    left:15px;
    width:100px;
    height:100px;
    border:1px solid rgba(0,234,255,.4);
    border-radius:50%;
    background:
    radial-gradient(
        circle,
        transparent 30%,
        rgba(0,234,255,.04) 31%,
        transparent 32%
    );
}

.radar::after{
    content:"";
    position:absolute;
    width:50%;
    height:1px;
    left:50%;
    top:50%;
    background:#00eaff;
    transform-origin:left;
    animation:radar 2s linear infinite;
    box-shadow:0 0 10px #00eaff;
}

.info{
    position:absolute;
    bottom:20px;
    right:15px;
    width:145px;
    border:1px solid rgba(0,234,255,.25);
    background:rgba(0,10,15,.7);
    padding:8px;
    font-size:9px;
    line-height:1.8;
}

.value{
    float:right;
    color:#00ff88;
}

.log{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:78px;
    width:90%;
    max-width:500px;
    max-height:90px;
    overflow:auto;
    border:1px solid rgba(0,234,255,.2);
    background:rgba(0,8,12,.75);
    padding:8px;
    font-size:10px;
    line-height:1.5;
}

.input-area{
    min-height:68px;
    display:flex;
    gap:7px;
    padding:9px;
    background:rgba(0,8,12,.95);
    border-top:1px solid rgba(0,234,255,.25);
}

input{
    flex:1;
    min-width:0;
    background:#031116;
    border:1px solid #07515f;
    color:white;
    border-radius:7px;
    padding:12px;
    outline:none;
}

input:focus{
    border-color:#00eaff;
    box-shadow:0 0 10px rgba(0,234,255,.2);
}

button{
    border:1px solid #00eaff;
    background:rgba(0,234,255,.08);
    color:#00eaff;
    border-radius:7px;
    padding:0 13px;
    font-weight:bold;
}

button:active{
    transform:scale(.96);
}

@keyframes spin{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

@keyframes spinReverse{
    from{transform:rotate(360deg)}
    to{transform:rotate(0)}
}

@keyframes pulse{
    50%{
        transform:scale(1.07);
        opacity:.5;
    }
}

@keyframes corePulse{
    50%{
        transform:scale(1.25);
        box-shadow:
        0 0 25px #00eaff,
        0 0 70px #00eaff,
        0 0 110px rgba(0,234,255,.7);
    }
}

@keyframes scan{
    0%,100%{
        transform:translateY(-130px);
        opacity:0;
    }
    50%{
        transform:translateY(130px);
        opacity:1;
    }
}

@keyframes radar{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

@media(max-width:600px){

    .hud-left,
    .hud-right{
        font-size:8px;
    }

    .info{
        display:none;
    }

    .radar{
        width:75px;
        height:75px;
        bottom:15px;
    }

    .log{
        bottom:72px;
        max-height:70px;
    }

    .input-area{
        height:65px;
    }

    button{
        padding:0 10px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">NEMIS 2.0</div>

    <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="status">SYSTEM ONLINE</span>
    </div>
</header>

<main>

<div class="hud">

<div class="hud-left">
NEMIS CORE<br>
NEURAL SYSTEM<br>
VOICE: READY<br>
AI: STANDBY
</div>

<div class="hud-right">
SYSTEM 2.0<br>
HOLOGRAPHIC HUD<br>
RADAR ACTIVE<br>
MOBILE MODE
</div>

</div>

<div class="hologram">

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>
<div class="ring ring4"></div>

<div class="energy"></div>

<img
src="hologram.gif"
class="hologram-image"
alt="NEMIS">

<div class="core"></div>

<div class="scan"></div>

</div>

<div class="radar"></div>

<div class="info">
IA <span class="value" id="ia">READY</span><br>
N8N <span class="value" id="n8n">OFF</span><br>
VOICE <span class="value">READY</span><br>
CORE <span class="value">100%</span>
</div>

<div class="log" id="log">
NEMIS 2.0 inicializada...<br>
Sistema holográfico online.
</div>

</main>

<div class="input-area">

<input
id="comando"
type="text"
placeholder="Digite um comando para NEMIS...">

<button onclick="ouvir()">🎙️</button>

<button onclick="enviar()">ENVIAR</button>

</div>

</div>

<script>

/* ==========================================
   NEMIS 2.0
   WEBHOOK N8N
   ========================================== */

const N8N_WEBHOOK_URL =
"COLE_AQUI_A_URL_DO_N8N";


function registrar(texto){

    const log =
    document.getElementById("log");

    const linha =
    document.createElement("div");

    linha.textContent = texto;

    log.prepend(linha);
}


function falar(texto){

    if(!window.speechSynthesis){
        return;
    }

    speechSynthesis.cancel();

    const voz =
    new SpeechSynthesisUtterance(texto);

    voz.lang = "pt-BR";
    voz.rate = 0.95;
    voz.pitch = 1;

    speechSynthesis.speak(voz);
}


async function enviar(){

    const campo =
    document.getElementById("comando");

    const comando =
    campo.value.trim();

    if(!comando){
        return;
    }

    campo.value = "";

    registrar(
        "VOCÊ: " + comando
    );

    document.getElementById("ia")
    .textContent = "PROCESSANDO";


    /* N8N ainda não configurado */

    if(
        N8N_WEBHOOK_URL.includes(
            "COLE_AQUI"
        )
    ){

        registrar(
            "NEMIS: conexão IA aguardando."
        );

        falar(
            "Olá. Eu sou a NEMIS. Minha conexão com a inteligência artificial ainda está aguardando configuração."
        );

        document.getElementById("ia")
        .textContent = "STANDBY";

        return;
    }


    document.getElementById("status")
    .textContent = "CONECTANDO N8N...";

    try{

        const resposta =
        await fetch(
            N8N_WEBHOOK_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    command:comando,

                    message:comando,

                    source:
                    "NEMIS_2.0",

                    language:
                    "pt-BR",

                    timestamp:
                    new Date()
                    .toISOString()

                })
            }
        );


        if(!resposta.ok){

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        const dados =
        await resposta.json();


        const respostaNEMIS =
        dados.response ||
        dados.answer ||
        dados.message ||
        dados.output ||
        "Comando processado.";


        registrar(
            "NEMIS: " +
            respostaNEMIS
        );


        falar(
            respostaNEMIS
        );


        document.getElementById("n8n")
        .textContent = "ONLINE";

        document.getElementById("ia")
        .textContent = "READY";

        document.getElementById("status")
        .textContent = "SYSTEM ONLINE";


    }catch(erro){

        console.error(erro);

        registrar(
            "NEMIS: falha na comunicação."
        );

        falar(
            "Não consegui acessar o servidor."
        );

        document.getElementById("n8n")
        .textContent = "ERROR";

        document.getElementById("ia")
        .textContent = "READY";

        document.getElementById("status")
        .textContent = "CONNECTION ERROR";
    }

}


/* ==========================================
   RECONHECIMENTO DE VOZ
   ========================================== */

let reconhecimento = null;

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(SpeechRecognition){

    reconhecimento =
    new SpeechRecognition();

    reconhecimento.lang =
    "pt-BR";

    reconhecimento.continuous =
    false;

    reconhecimento.interimResults =
    false;


    reconhecimento.onstart =
    function(){

        document.getElementById("status")
        .textContent = "OUVINDO...";

        registrar(
            "NEMIS: ouvindo."
        );

    };


    reconhecimento.onresult =
    function(event){

        const texto =
        event.results[0][0]
        .transcript;

        document.getElementById(
            "comando"
        ).value = texto;

        enviar();

    };


    reconhecimento.onerror =
    function(){

        document.getElementById("status")
        .textContent =
        "SYSTEM ONLINE";

    };

}


function ouvir(){

    if(reconhecimento){

        reconhecimento.start();

    }else{

        falar(
            "O reconhecimento de voz não está disponível neste navegador."
        );

    }

}


/* ENTER PARA ENVIAR */

document.getElementById(
"comando"
).addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        enviar();

    }

});

</script>

</body>
      </html>
