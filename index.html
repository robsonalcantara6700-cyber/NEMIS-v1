<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. - Assistente Pessoal</title>
  <style>
    :root {
      --primary: #00f3ff;
      --primary-dim: rgba(0, 243, 255, 0.2);
      --bg: #050b14;
      --card-bg: rgba(10, 25, 47, 0.7);
      --text: #e6f1ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, monospace, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Cabeçalho Futurista */
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px var(--primary-dim);
    }

    h1 {
      color: var(--primary);
      letter-spacing: 3px;
      font-size: 1.8rem;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--primary);
    }

    .clock-widget {
      text-align: right;
    }

    #clock {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary);
    }

    /* Elemento Central - Reator ARC */
    .arc-reactor-container {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arc-reactor {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 0 25px var(--primary), inset 0 0 25px var(--primary);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pulse 3s infinite ease-in-out;
      cursor: pointer;
    }

    .arc-core {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 15px #fff, 0 0 30px var(--primary);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px var(--primary); }
      50% { transform: scale(1.05); box-shadow: 0 0 45px var(--primary); }
    }

    /* Grid de Painéis */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--primary-dim);
      border-radius: 8px;
      padding: 20px;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .panel h2 {
      font-size: 1.1rem;
      color: var(--primary);
      border-bottom: 1px solid var(--primary-dim);
      padding-bottom: 8px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    /* Formulários e Entradas */
    input, button, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid var(--primary-dim);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px var(--primary-dim);
    }

    button {
      background: var(--primary-dim);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
    }

    button:hover {
      background: var(--primary);
      color: var(--bg);
      box-shadow: 0 0 15px var(--primary);
    }

    /* Listas e Elementos Dinâmicos */
    ul {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
    }

    li {
      padding: 8px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 5px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-del {
      width: auto;
      padding: 2px 8px;
      margin: 0;
      background: transparent;
      border: 1px solid #ff4a4a;
      color: #ff4a4a;
    }

    .btn-del:hover {
      background: #ff4a4a;
      color: #fff;
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .quick-links button {
      margin: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S.</h1>
    <div class="clock-widget">
      <div id="clock">00:00:00</div>
      <div id="date" style="font-size: 0.8rem; color: #8892b0;">--/--/----</div>
    </div>
  </header>

  <div class="arc-reactor-container">
    <div class="arc-reactor" id="speak-btn" title="Clique para ouvir as tarefas do dia">
      <div class="arc-core"></div>
    </div>
  </div>

  <div class="dashboard">

    <!-- Painel 1: Atalhos Rápidos de Trabalho -->
    <div class="panel">
      <h2>Atalhos do Sistema</h2>
      <div class="quick-links">
        <button onclick="openSite('https://google.com')">Google</button>
        <button onclick="openSite('https://youtube.com')">YouTube</button>
        <button onclick="openSite('https://github.com')">GitHub</button>
        <button onclick="openSite('https://web.whatsapp.com')">WhatsApp</button>
      </div>
      <br>
      <input type="text" id="custom-url" placeholder="Digitar URL (ex: gmail.com)">
      <button onclick="openCustomSite()">Acessar site</button>
    </div>

    <!-- Painel 2: Gerenciador de Tarefas -->
    <div class="panel">
      <h2>Lista de Tarefas</h2>
      <input type="text" id="task-input" placeholder="Nova tarefa para hoje...">
      <button onclick="addTask()">Adicionar Tarefa</button>
      <ul id="task-list"></ul>
    </div>

    <!-- Painel 3: Cronômetro de Foco / Temporizador -->
    <div class="panel">
      <h2>Timer de Produtividade</h2>
      <div id="timer-display" style="font-size: 2rem; text-align: center; margin: 10px 0; color: var(--primary);">25:00</div>
      <div style="display: flex; gap: 10px;">
        <button onclick="startTimer()">Iniciar</button>
        <button onclick="pauseTimer()">Pausar</button>
        <button onclick="resetTimer()">Resetar</button>
      </div>
    </div>

    <!-- Painel 4: Bloco de Notas Rápido -->
    <div class="panel">
      <h2>Bloco de Notas Rápido</h2>
      <textarea id="notes" rows="5" placeholder="Digite suas anotações aqui..."></textarea>
      <button onclick="saveNotes()">Salvar Nota</button>
    </div>

  </div>

  <script>
    // --- Relógio e Data ---
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('pt-BR');
      document.getElementById('date').innerText = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Síntese de Voz (JARVIS Fala) ---
    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        utterance.pitch = 0.9; // Tom um pouco mais grave estilo robô
        window.speechSynthesis.speak(utterance);
      }
    }

    // --- Efeito Sonoro Futurista ---
    function playBeep() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- Navegação Rápida ---
    function openSite(url) {
      playBeep();
      window.open(url, '_blank');
    }

    function openCustomSite() {
      let url = document.getElementById('custom-url').value.trim();
      if (url) {
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        openSite(url);
        document.getElementById('custom-url').value = '';
      }
    }

    // --- Lista de Tarefas (com LocalStorage) ---
    let tasks = JSON.parse(localStorage.getItem('jarvis_tasks')) || [];

    function renderTasks() {
      const list = document.getElementById('task-list');
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${task}</span>
          <button class="btn-del" onclick="deleteTask(${index})">X</button>
        `;
        list.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('task-input');
      if (input.value.trim() !== '') {
        playBeep();
        tasks.push(input.value.trim());
        localStorage.setItem('jarvis_tasks', JSON.stringify(tasks));
        renderTasks();
        input.value = '';
      }
    }

    function deleteTask(index) {
      playBeep();
      tasks.splice(index, 1);
      localStorage.setItem('jarvis_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    renderTasks();

    // --- Bloco de Notas (com LocalStorage) ---
    const notesField = document.getElementById('notes');
    notesField.value = localStorage.getItem('jarvis_notes') || '';

    function saveNotes() {
      playBeep();
      localStorage.setItem('jarvis_notes', notesField.value);
      speak("Notas atualizadas no sistema, Senhor.");
    }

    // --- Timer de Produtividade ---
    let timerInterval;
    let timeLeft = 25 * 60;

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('timer-display').innerText = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      playBeep();
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            speak("Ciclo de produtividade concluído, Senhor.");
          }
        }, 1000);
      }
    }

    function pauseTimer() {
      playBeep();
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      playBeep();
      pauseTimer();
      timeLeft = 25 * 60;
      updateTimerDisplay();
    }

    // --- Interação ao clicar no Reator ARC ---
    document.getElementById('speak-btn').addEventListener('click', () => {
      playBeep();
      const taskCount = tasks.length;
      let msg = "Sistemas operacionais. ";
      if (taskCount === 0) {
        msg += "Você não possui tarefas pendentes para hoje.";
      } else {
        msg += `Você possui ${taskCount} ${taskCount === 1 ? 'tarefa pendente' : 'tarefas pendentes'}.`;
      }
      speak(msg);
    });
  </script>
</body>
</html>
