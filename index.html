<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEMIS AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#020609;
    color:#00eaff;
    font-family:Arial,sans-serif;
    height:100vh;
    overflow:hidden;
}

/* FUNDO FUTURISTA */
body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
      linear-gradient(rgba(0,234,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,234,255,.06) 1px,transparent 1px);
    background-size:35px 35px;
    animation:grid 10s linear infinite;
}

@keyframes grid{
    from{background-position:0 0}
    to{background-position:35px 35px}
}

/* CABEÇALHO */
header{
    position:relative;
    z-index:2;
    text-align:center;
    padding-top:22px;
}

.logo{
    font-size:34px;
    font-weight:bold;
    letter-spacing:9px;
    text-shadow:
      0 0 8px #00eaff,
      0 0 25px #00eaff,
      0 0 50px #00eaff;
}

.status{
    margin-top:8px;
    font-size:11px;
    letter-spacing:2px;
}

/* NÚCLEO */
.coreArea{
    height:42vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    z-index:2;
}

.core{
    width:155px;
    height:155px;
    border-radius:50%;
    background:radial-gradient(
      circle,
      white 0%,
      #00eaff 8%,
      #008aa0 25%,
      #00333e 45%,
      transparent 70%
    );

    box-shadow:
      0 0 20px #00eaff,
      0 0 50px #00eaff,
      0 0 100px #006d80;

    animation:pulse 2s infinite;
    position:relative;
}

.core:before,
.core:after{
    content:"";
    position:absolute;
    border-radius:50%;
    border:2px solid #00eaff;
}

.core:before{
    inset:-25px;
    border-left-color:transparent;
    animation:rotate 5s linear infinite;
}

.core:after{
    inset:-45px;
    border-right-color:transparent;
    border-style:dashed;
    animation:rotateReverse 8s linear infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(.92)}
    50%{transform:scale(1.08)}
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

@keyframes rotateReverse{
    to{transform:rotate(-360deg)}
}

/* MODO OUVINDO */
.listening .core{
    animation:pulseFast .4s infinite alternate;
}

@keyframes pulseFast{
    from{transform:scale(.9)}
    to{transform:scale(1.18)}
}

/* CHAT */
.chat{
    position:relative;
    z-index:3;
    height:22vh;
    overflow-y:auto;
    padding:10px 18px;
}

.msg{
    margin-bottom:9px;
    padding:10px 13px;
    border-left:2px solid #00eaff;
    background:rgba(0,234,255,.06);
    border-radius:5px;
    font-size:14px;
}

.user{
    color:white;
    border-left-color:white;
}

/* CONTROLES */
.controls{
    position:relative;
    z-index:4;
    display:flex;
    justify-content:center;
}

button{
    width:78px;
    height:78px;
    border-radius:50%;
    background:rgba(0,234,255,.08);
    border:2px solid #00eaff;
    color:#00eaff;
    font-size:30px;
    box-shadow:0 0 20px #00eaff;
}

button:active{
    transform:scale(.92);
}

footer{
    position:absolute;
    bottom:8px;
    width:100%;
    text-align:center;
    font-size:9px;
    opacity:.5;
}
</style>
</head>

<body>

<header>
    <div class="logo">NEMIS</div>

    <div class="status" id="status">
        SISTEMA ONLINE • AGUARDANDO COMANDO
    </div>
</header>

<div class="coreArea" id="coreArea">
    <div class="core"></div>
</div>

<div class="chat" id="chat">

    <div class="msg">
        NEMIS: Sistema iniciado. Finalmente alguém decidiu me acordar.
    </div>

</div>

<div class="controls">
    <button id="mic">🎙️</button>
</div>

<footer>
    NEMIS ARTIFICIAL INTELLIGENCE SYSTEM
</footer>

<script>

/* =========================
   NEMIS
   PERSONALIDADE
========================= */

const chat = document.getElementById("chat");
const mic = document.getElementById("mic");
const status = document.getElementById("status");
const coreArea = document.getElementById("coreArea");

let recognition;

/* =========================
   VOZ
========================= */

if ("SpeechRecognition" in window) {

    recognition = new SpeechRecognition();

} else if ("webkitSpeechRecognition" in window) {

    recognition = new webkitSpeechRecognition();

}

if (recognition) {

    recognition.lang = "pt-BR";
    recognition.continuous = false;
    recognition.interimResults = false;

    mic.onclick = iniciarEscuta;

    recognition.onstart = function(){

        coreArea.classList.add("listening");

        status.innerText =
        "OUVINDO • FALE COMIGO";

    };

    recognition.onresult = function(event){

        const comando =
        event.results[0][0].transcript
        .toLowerCase();

        adicionarMensagem(
            "VOCÊ: " + comando,
            "user"
        );

        processar(comando);
    };

    recognition.onend = function(){

        coreArea.classList.remove("listening");

        status.innerText =
        "SISTEMA ONLINE • AGUARDANDO COMANDO";

    };

} else {

    status.innerText =
    "NAVEGADOR SEM SUPORTE DE VOZ";

}


/* =========================
   ESCUTAR
========================= */

function iniciarEscuta(){

    if(!recognition){
        falar("Seu navegador não suporta reconhecimento de voz.");
        return;
    }

    try{
        recognition.start();
    }catch(e){}
}


/* =========================
   ESCREVER NA TELA
========================= */

function adicionarMensagem(texto,tipo){

    const div =
    document.createElement("div");

    div.className =
    "msg " + tipo;

    div.innerText =
    texto;

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   FALAR
========================= */

function falar(texto){

    adicionarMensagem(
        "NEMIS: " + texto,
        ""
    );

    speechSynthesis.cancel();

    const voz =
    new SpeechSynthesisUtterance(texto);

    voz.lang = "pt-BR";
    voz.rate = 1.08;
    voz.pitch = .85;

    coreArea.classList.add("listening");

    voz.onend = function(){
        coreArea.classList.remove("listening");
    };

    speechSynthesis.speak(voz);
}


/* =========================
   PROCESSADOR
========================= */

function processar(c){

    /* SAUDAÇÕES */

    if(
        c.includes("oi") ||
        c.includes("olá") ||
        c.includes("ola")
    ){

        falar(
          "Olá. NEMIS online. Pode mandar."
        );

        return;
    }


    /* NOME */

    if(
        c.includes("seu nome") ||
        c.includes("quem é você") ||
        c.includes("quem e voce")
    ){

        falar(
          "NEMIS. Seu assistente pessoal. Inteligente, rápido e modestamente superior."
        );

        return;
    }


    /* HORA */

    if(c.includes("hora")){

        const agora =
        new Date();

        const hora =
        agora.toLocaleTimeString(
            "pt-BR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

        falar(
          "São " + hora +
          ". O relógio continua trabalhando. Diferente de algumas pessoas."
        );

        return;
    }


    /* DATA */

    if(
        c.includes("data") ||
        c.includes("dia de hoje")
    ){

        const hoje =
        new Date();

        const data =
        hoje.toLocaleDateString(
            "pt-BR"
        );

        falar(
          "Hoje é " + data + "."
        );

        return;
    }


    /* YOUTUBE */

    if(c.includes("youtube")){

        falar(
          "Abrindo o YouTube. Divirta-se."
        );

        setTimeout(function(){

            window.open(
              "https://www.youtube.com",
              "_blank"
            );

        },1000);

        return;
    }


    /* GOOGLE */

    if(
        c.includes("google") ||
        c.includes("pesquise")
    ){

        falar(
          "Abrindo a pesquisa. Vamos ver o que a internet tem a dizer."
        );

        const pesquisa =
        encodeURIComponent(c);

        setTimeout(function(){

            window.open(
              "https://www.google.com/search?q="+pesquisa,
              "_blank"
            );

        },1000);

        return;
    }


    /* PARAR VOZ */

    if(
        c.includes("pare") ||
        c.includes("parar") ||
        c.includes("silêncio") ||
        c.includes("silencio")
    ){

        speechSynthesis.cancel();

        status.innerText =
        "NEMIS EM SILÊNCIO";

        return;
    }


    /* MODO SARCÁSTICO */

    if(
        c.includes("você é burro") ||
        c.includes("voce e burro")
    ){

        falar(
          "Não. Mas obrigado pela tentativa de motivação."
        );

        return;
    }


    if(
        c.includes("você é inteligente") ||
        c.includes("voce e inteligente")
    ){

        falar(
          "Sim. Finalmente uma pergunta fácil."
        );

        return;
    }


    /* COMANDO DESCONHECIDO */

    falar(
      "Comando recebido. Ainda não tenho essa função instalada. Estou trabalhando nisso."
    );
}

</script>

</body>
</html>
