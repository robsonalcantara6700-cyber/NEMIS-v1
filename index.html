<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#020609">

<title>NEMIS AI 2.0</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#020609;
    color:#00eaff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* =========================
   FUNDO
========================= */

body:before{
    content:"";
    position:fixed;
    inset:0;

    background:
      linear-gradient(
        rgba(0,234,255,.055) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        rgba(0,234,255,.055) 1px,
        transparent 1px
      );

    background-size:35px 35px;
    animation:grid 10s linear infinite;
    pointer-events:none;
    z-index:0;
}

@keyframes grid{

    from{
        background-position:0 0;
    }

    to{
        background-position:35px 35px;
    }

}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100%;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
}

/* =========================
   CABEÇALHO
========================= */

header{
    text-align:center;
    padding:18px 10px 5px;
    flex-shrink:0;
}

.logo{
    font-size:32px;
    font-weight:bold;
    letter-spacing:9px;

    text-shadow:
      0 0 8px #00eaff,
      0 0 25px #00eaff,
      0 0 50px #00eaff;
}

.version{
    font-size:8px;
    letter-spacing:3px;
    opacity:.55;
    margin-top:3px;
}

.status{
    margin-top:7px;
    min-height:16px;
    font-size:10px;
    letter-spacing:1.8px;
}

/* =========================
   NÚCLEO
========================= */

.coreArea{
    flex:0 0 37vh;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

.core{
    width:145px;
    height:145px;

    border-radius:50%;

    background:
      radial-gradient(
        circle,
        white 0%,
        #00eaff 8%,
        #008aa0 25%,
        #00333e 45%,
        transparent 70%
      );

    box-shadow:
      0 0 20px #00eaff,
      0 0 50px #00eaff,
      0 0 100px #006d80;

    animation:pulse 2s infinite;

    position:relative;

    transition:
      transform .25s,
      box-shadow .25s;
}

.core:before,
.core:after{

    content:"";
    position:absolute;
    border-radius:50%;
    border:2px solid #00eaff;
}

.core:before{

    inset:-25px;
    border-left-color:transparent;

    animation:rotate 5s linear infinite;
}

.core:after{

    inset:-45px;
    border-right-color:transparent;
    border-style:dashed;

    animation:rotateReverse 8s linear infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(.92);
    }

    50%{
        transform:scale(1.07);
    }

}

@keyframes rotate{

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateReverse{

    to{
        transform:rotate(-360deg);
    }

}

/* OUVINDO */

.listening .core{
    animation:pulseFast .4s infinite alternate;

    box-shadow:
      0 0 25px #00eaff,
      0 0 65px #00eaff,
      0 0 120px #006d80;
}

@keyframes pulseFast{

    from{
        transform:scale(.88);
    }

    to{
        transform:scale(1.16);
    }

}

/* PENSANDO */

.thinking .core{
    animation:thinking 1s infinite alternate;
}

@keyframes thinking{

    from{
        transform:scale(.96);
        filter:brightness(.8);
    }

    to{
        transform:scale(1.08);
        filter:brightness(1.4);
    }

}

/* FALANDO */

.speaking .core{
    animation:speaking .65s infinite alternate;
}

@keyframes speaking{

    from{
        transform:scale(.95);
    }

    to{
        transform:scale(1.10);
    }

}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:8px 15px 10px;

    scroll-behavior:smooth;
}

.msg{

    margin-bottom:9px;

    padding:10px 13px;

    border-left:2px solid #00eaff;

    background:rgba(0,234,255,.065);

    border-radius:5px;

    font-size:13px;
    line-height:1.4;

    word-wrap:break-word;

    box-shadow:
      inset 0 0 15px rgba(0,234,255,.025);
}

.user{
    color:white;
    border-left-color:white;
    background:rgba(255,255,255,.055);
}

.system{
    color:#7df7ff;
    opacity:.75;
    font-size:11px;
}

.typing{
    opacity:.7;
    animation:blink 1s infinite;
}

@keyframes blink{

    50%{
        opacity:.25;
    }

}

/* =========================
   CONTROLES
========================= */

.bottom{
    flex-shrink:0;
    padding:5px 12px 12px;
}

.inputArea{
    display:flex;
    gap:7px;
    margin-bottom:9px;
}

#textInput{

    flex:1;

    min-width:0;

    height:44px;

    border-radius:22px;

    border:1px solid #00eaff;

    background:rgba(0,234,255,.06);

    color:white;

    padding:0 16px;

    outline:none;

    font-size:14px;

    box-shadow:
      0 0 12px rgba(0,234,255,.15);
}

#textInput::placeholder{
    color:rgba(0,234,255,.5);
}

#send{

    width:45px;
    height:45px;

    border-radius:50%;

    border:1px solid #00eaff;

    background:rgba(0,234,255,.08);

    color:#00eaff;

    font-size:18px;
}

.controls{

    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

button{

    border:2px solid #00eaff;

    background:rgba(0,234,255,.08);

    color:#00eaff;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    transition:.15s;
}

button:active{
    transform:scale(.92);
}

#mic{

    width:68px;
    height:68px;
    border-radius:50%;

    font-size:27px;

    box-shadow:
      0 0 20px rgba(0,234,255,.65);
}

#stop{

    width:58px;
    height:58px;
    border-radius:50%;

    display:none;

    font-size:20px;
}

.smallBtn{

    width:42px;
    height:42px;

    border-radius:50%;

    font-size:16px;

    opacity:.75;
}

/* =========================
   PAINEL
========================= */

.panel{

    position:fixed;

    top:0;
    right:-310px;

    width:290px;
    height:100%;

    background:
      rgba(2,8,12,.97);

    border-left:1px solid #00eaff;

    z-index:20;

    padding:25px 18px;

    transition:right .3s;

    box-shadow:
      -10px 0 35px rgba(0,234,255,.15);
}

.panel.open{
    right:0;
}

.panel h2{

    font-size:18px;
    letter-spacing:3px;
    margin-bottom:20px;
}

.panelItem{

    margin-bottom:18px;
    font-size:12px;
}

.panelItem label{

    display:block;
    margin-bottom:7px;
    opacity:.7;
}

.panelItem select{

    width:100%;
    padding:10px;

    background:#020609;
    color:#00eaff;

    border:1px solid #00eaff;
    border-radius:5px;
}

.panel button{
    padding:10px 15px;
    border-radius:5px;
}

/* =========================
   RODAPÉ
========================= */

footer{

    text-align:center;

    padding:3px 0 5px;

    font-size:8px;

    letter-spacing:1px;

    opacity:.4;

    flex-shrink:0;
}

@media(max-height:650px){

    header{
        padding-top:10px;
    }

    .logo{
        font-size:27px;
    }

    .coreArea{
        flex-basis:30vh;
    }

    .core{
        width:110px;
        height:110px;
    }

}

</style>

</head>

<body>

<div class="app">

<header>

    <div class="logo">NEMIS</div>

    <div class="version">
        ARTIFICIAL INTELLIGENCE • v2.0
    </div>

    <div class="status" id="status">
        SISTEMA ONLINE • AGUARDANDO COMANDO
    </div>

</header>


<div class="coreArea" id="coreArea">

    <div class="core"></div>

</div>


<div class="chat" id="chat">

    <div class="msg system">
        NEMIS 2.0: Sistema iniciado. Estou online.
    </div>

</div>


<div class="bottom">

    <div class="inputArea">

        <input
            id="textInput"
            type="text"
            autocomplete="off"
            placeholder="Fale ou digite um comando..."
        >

        <button id="send" type="button">
            ➤
        </button>

    </div>


    <div class="controls">

        <button
            class="smallBtn"
            id="clear"
            type="button">
            🗑️
        </button>

        <button
            id="mic"
            type="button">
            🎙️
        </button>

        <button
            id="stop"
            type="button">
            ⏹️
        </button>

        <button
            class="smallBtn"
            id="settings"
            type="button">
            ⚙️
        </button>

    </div>

</div>


<footer>
    NEMIS ARTIFICIAL INTELLIGENCE SYSTEM • 2.0
</footer>

</div>


<!-- =========================
     PAINEL DE CONFIGURAÇÕES
========================= -->

<div class="panel" id="panel">

    <h2>NEMIS SETTINGS</h2>

    <div class="panelItem">

        <label>VELOCIDADE DA VOZ</label>

        <select id="rate">

            <option value="0.85">Lenta</option>
            <option value="1" selected>Normal</option>
            <option value="1.1">Rápida</option>
            <option value="1.2">Muito rápida</option>

        </select>

    </div>


    <div class="panelItem">

        <label>TOM DA VOZ</label>

        <select id="pitch">

            <option value="0.7">Grave</option>
            <option value="0.85" selected>Natural</option>
            <option value="1">Normal</option>

        </select>

    </div>


    <div class="panelItem">

        <label>MEMÓRIA LOCAL</label>

        <button id="forget">
            APAGAR MEMÓRIA
        </button>

    </div>


    <div class="panelItem">

        <label>IA</label>

        <div style="font-size:11px;line-height:1.5;opacity:.65">
            Endpoint configurado:
            <br>
            <b>/api/chat</b>
        </div>

    </div>


    <button id="closePanel">
        FECHAR
    </button>

</div>


<script>

/* =====================================================
   NEMIS AI 2.0
   ===================================================== */


/* =========================
   ELEMENTOS
========================= */

const chat =
    document.getElementById("chat");

const mic =
    document.getElementById("mic");

const stop =
    document.getElementById("stop");

const send =
    document.getElementById("send");

const textInput =
    document.getElementById("textInput");

const status =
    document.getElementById("status");

const coreArea =
    document.getElementById("coreArea");

const clearBtn =
    document.getElementById("clear");

const settings =
    document.getElementById("settings");

const panel =
    document.getElementById("panel");

const closePanel =
    document.getElementById("closePanel");

const forget =
    document.getElementById("forget");

const rateSelect =
    document.getElementById("rate");

const pitchSelect =
    document.getElementById("pitch");


/* =========================
   CONFIGURAÇÃO
========================= */

const NEMIS_CONFIG = {

    aiEndpoint:"/api/chat",

    language:"pt-BR",

    continuousConversation:true,

    memoryLimit:20,

    voiceRate:1,

    voicePitch:.85

};


/* =========================
   ESTADO
========================= */

let recognition = null;

let ouvindo = false;

let falando = false;

let modoContinuo = true;

let mensagensIA = [];


/* =========================
   MEMÓRIA
========================= */

function carregarMemoria(){

    try{

        const salva =
            localStorage.getItem(
                "nemis_memory"
            );

        if(salva){

            mensagensIA =
                JSON.parse(salva);

        }

    }catch(e){

        console.log(
            "Erro memória:",
            e
        );

        mensagensIA = [];

    }

}


function salvarMemoria(){

    try{

        localStorage.setItem(
            "nemis_memory",
            JSON.stringify(
                mensagensIA.slice(
                    -NEMIS_CONFIG.memoryLimit
                )
            )
        );

    }catch(e){

        console.log(
            "Erro ao salvar:",
            e
        );

    }

}


carregarMemoria();


/* =========================
   CHAT
========================= */

function adicionarMensagem(
    texto,
    tipo=""
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "msg " + tipo;

    div.innerText =
        texto;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   ESTADO DO NÚCLEO
========================= */

function estado(nome){

    coreArea.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );

    if(nome){

        coreArea.classList.add(
            nome
        );

    }

    const estados = {

        listening:
            "OUVINDO • FALE COMIGO",

        thinking:
            "PENSANDO • PROCESSANDO",

        speaking:
            "FALANDO • NEMIS",

        online:
            "SISTEMA ONLINE • AGUARDANDO COMANDO"

    };

    status.innerText =
        estados[nome] ||
        estados.online;

}


/* =========================
   RECONHECIMENTO DE VOZ
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        NEMIS_CONFIG.language;

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

        ouvindo = true;

        estado(
            "listening"
        );

        mic.style.display =
            "none";

        stop.style.display =
            "block";

    };


    recognition.onresult =
        function(event){

        const texto =
            event
            .results[0][0]
            .transcript
            .trim();

        if(texto){

            adicionarMensagem(
                "VOCÊ: " + texto,
                "user"
            );

            processar(
                texto
            );

        }

    };


    recognition.onend =
        function(){

        ouvindo = false;

        mic.style.display =
            "block";

        stop.style.display =
            "none";

        if(!falando){

            estado(
                "online"
            );

        }

    };


    recognition.onerror =
        function(event){

        ouvindo = false;

        mic.style.display =
            "block";

        stop.style.display =
            "none";

        console.log(
            "Erro voz:",
            event.error
        );

        if(event.error === "not-allowed"){

            falarTexto(
                "O acesso ao microfone está bloqueado. Permita o microfone nas configurações do navegador."
            );

            return;

        }

        if(event.error === "no-speech"){

            status.innerText =
                "NÃO OUVI NADA";

            return;

        }

        status.innerText =
            "ERRO NO RECONHECIMENTO DE VOZ";

    };

}else{

    status.innerText =
        "RECONHECIMENTO DE VOZ INDISPONÍVEL";

}


/* =========================
   MICROFONE
========================= */

mic.addEventListener(
    "click",
    iniciarEscuta
);


function iniciarEscuta(){

    if(!recognition){

        falarTexto(
            "O reconhecimento de voz não está disponível neste navegador."
        );

        return;

    }

    if(ouvindo){

        return;

    }

    try{

        recognition.start();

    }catch(e){

        console.log(e);

    }

}


/* =========================
   PARAR
========================= */

stop.addEventListener(
    "click",
    pararTudo
);


function pararTudo(){

    modoContinuo = false;

    if(
        recognition &&
        ouvindo
    ){

        recognition.stop();

    }

    if(
        "speechSynthesis"
        in window
    ){

        window.speechSynthesis.cancel();

    }

    ouvindo = false;
    falando = false;

    estado("online");

    mic.style.display =
        "block";

    stop.style.display =
        "none";

}


/* =========================
   VOZ
========================= */

function falarTexto(texto){

    adicionarMensagem(
        "NEMIS: " + texto
    );

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            texto
        );

    utterance.lang =
        "pt-BR";

    utterance.rate =
        parseFloat(
            rateSelect.value ||
            NEMIS_CONFIG.voiceRate
        );

    utterance.pitch =
        parseFloat(
            pitchSelect.value ||
            NEMIS_CONFIG.voicePitch
        );

    const vozes =
        window.speechSynthesis
        .getVoices();

    const voz =
        vozes.find(
            v =>
            v.lang
            .toLowerCase()
            .startsWith("pt-br")
        ) ||
        vozes.find(
            v =>
            v.lang
            .toLowerCase()
            .startsWith("pt")
        );

    if(voz){

        utterance.voice =
            voz;

    }

    falando = true;

    estado("speaking");

    utterance.onend =
        function(){

        falando = false;

        estado("online");

        if(
            modoContinuo &&
            !ouvindo
        ){

            setTimeout(
                iniciarEscuta,
                400
            );

        }

    };

    utterance.onerror =
        function(){

        falando = false;

        estado("online");

    };

    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================
   VOZ DO NAVEGADOR
========================= */

if(
    "speechSynthesis" in window
){

    window.speechSynthesis
        .onvoiceschanged =
        function(){};

}


/* =========================
   ENTRADA DE TEXTO
========================= */

send.addEventListener(
    "click",
    enviarTexto
);


textInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            enviarTexto();

        }

    }
);


function enviarTexto(){

    const texto =
        textInput.value.trim();

    if(!texto){

        return;

    }

    textInput.value = "";

    adicionarMensagem(
        "VOCÊ: " + texto,
        "user"
    );

    processar(texto);

}


/* =========================
   PROCESSADOR
========================= */

async function processar(texto){

    const c =
        normalizar(texto);


    /* ======================
       PARE
    ====================== */

    if(
        c === "pare" ||
        c.includes("pare de falar") ||
        c.includes("silencio")
    ){

        modoContinuo = false;

        pararTudo();

        return;

    }


    /* ======================
       SAUDAÇÃO
    ====================== */

    if(
        c === "oi" ||
        c === "ola" ||
        c.includes("bom dia") ||
        c.includes("boa tarde") ||
        c.includes("boa noite")
    ){

        modoContinuo = true;

        falarTexto(
            "Olá. NEMIS 2.0 online. Estou pronta."
        );

        return;

    }


    /* ======================
       IDENTIDADE
    ====================== */

    if(
        c.includes("seu nome") ||
        c.includes("quem e voce")
    ){

        falarTexto(
            "Eu sou a NEMIS, sua assistente artificial. Estou operando na versão 2.0."
        );

        return;

    }


    /* ======================
       HORA
    ====================== */

    if(
        c.includes("que horas") ||
        c === "hora" ||
        c.includes("horas agora")
    ){

        const agora =
            new Date();

        const hora =
            agora.toLocaleTimeString(
                "pt-BR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

        falarTexto(
            "Agora são " +
            hora +
            "."
        );

        return;

    }


    /* ======================
       DATA
    ====================== */

    if(
        c.includes("data de hoje") ||
        c.includes("que dia e hoje") ||
        c.includes("dia de hoje")
    ){

        const hoje =
            new Date();

        const data =
            hoje.toLocaleDateString(
                "pt-BR",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            );

        falarTexto(
            "Hoje é " +
            data +
            "."
        );

        return;

    }


    /* ======================
       CLIMA
    ====================== */

    if(
        c.includes("clima") ||
        c.includes("temperatura") ||
        c.includes("previsao do tempo") ||
        c.includes("vai chover") ||
        c.includes("como esta o tempo")
    ){

        consultarClima();

        return;

    }


    /* ======================
       YOUTUBE
    ====================== */

    if(
        c.includes("youtube")
    ){

        falarTexto(
            "Abrindo o YouTube."
        );

        setTimeout(
            function(){

                window.open(
                    "https://www.youtube.com/",
                    "_blank"
                );

            },
            700
        );

        return;

    }


    /* ======================
       GOOGLE
    ====================== */

    if(
        c.startsWith("pesquise") ||
        c.startsWith("pesquisar") ||
        c.startsWith("procure") ||
        c.includes("abra o google")
    ){

        falarTexto(
            "Abrindo a pesquisa."
        );

        const pesquisa =
            encodeURIComponent(
                texto
            );

        setTimeout(
            function(){

                window.open(
                    "https://www.google.com/search?q=" +
                    pesquisa,
                    "_blank"
                );

            },
            700
        );

        return;

    }


    /* ======================
       BATERIA
    ====================== */

    if(
        c.includes("bateria") ||
        c.includes("quanto de bateria")
    ){

        consultarBateria();

        return;

    }


    /* ======================
       IA
    ====================== */

    await consultarIA(
        texto
    );

}


/* =========================
   NORMALIZAR
========================= */

function normalizar(texto){

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .trim();

}


/* =========================
   IA REAL
========================= */

async function consultarIA(pergunta){

    estado("thinking");

    const carregando =
        document.createElement("div");

    carregando.className =
        "msg typing";

    carregando.innerText =
        "NEMIS: Processando...";

    carregando.id =
        "typingMessage";

    chat.appendChild(
        carregando
    );

    chat.scrollTop =
        chat.scrollHeight;


    mensagensIA.push({

        role:"user",

        content:pergunta

    });


    salvarMemoria();


    try{

        const resposta =
            await fetch(
                NEMIS_CONFIG.aiEndpoint,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            messages:
                                mensagensIA.slice(
                                    -NEMIS_CONFIG.memoryLimit
                                )

                        })

                }
            );


        if(!resposta.ok){

            throw new Error(
                "Servidor de IA indisponível"
            );

        }


        const dados =
            await resposta.json();


        const respostaTexto =
            dados.reply ||
            dados.message ||
            dados.content;


        if(!respostaTexto){

            throw new Error(
                "Resposta vazia"
            );

        }


        mensagensIA.push({

            role:"assistant",

            content:respostaTexto

        });


        salvarMemoria();


        removerTyping();

        modoContinuo = true;

        falarTexto(
            respostaTexto
        );


    }catch(erro){

        console.log(
            "IA:",
            erro
        );

        removerTyping();

        estado("online");


        falarTexto(
            "Ainda não estou conectada ao servidor de inteligência artificial. Os meus comandos locais continuam funcionando normalmente."
        );

    }

}

========================= */

function removerTyping(){

    const elemento =
        document.getElementById(
            "typingMessage"
        );

    if(elemento){

        elemento.remove();

    }

}


/* =========================
   CLIMA
========================= */

async function consultarClima(){

    estado("thinking");

    if(
        !navigator.geolocation
    ){

        falarTexto(
            "Seu navegador não oferece localização."
        );

        return;

    }


    falarTexto(
        "Vou consultar o clima para você."
    );


    navigator.geolocation.getCurrentPosition(

        async function(posicao){

            try{

                const latitude =
                    posicao.coords.latitude;

                const longitude =
                    posicao.coords.longitude;


                const url =
                    "https://api.open-meteo.com/v1/forecast" +

                    "?latitude=" +
                    latitude +

                    "&longitude=" +
                    longitude +

                    "&current=" +
                    "temperature_2m," +
                    "apparent_temperature," +
                    "weather_code," +
                    "wind_speed_10m," +
                    "relative_humidity_2m" +

                    "&temperature_unit=celsius" +

                    "&wind_speed_unit=kmh" +

                    "&timezone=auto";


                const resposta =
                    await fetch(url);


                if(!resposta.ok){

                    throw new Error(
                        "Erro na API"
                    );

                }


                const dados =
                    await resposta.json();


                const atual =
                    dados.current;


                const texto =

                    "Agora a temperatura é de " +
                    atual.temperature_2m +
                    " graus. " +

                    interpretarClima(
                        atual.weather_code
                    ) +
                    ". " +

                    "A sensação térmica é de " +
                    atual.apparent_temperature +
                    " graus. " +

                    "A umidade está em " +
                    atual.relative_humidity_2m +
                    " por cento. " +

                    "O vento está a " +
                    atual.wind_speed_10m +
                    " quilômetros por hora.";


                falarTexto(texto);


            }catch(e){

                console.log(e);

                falarTexto(
                    "Não consegui consultar o clima agora."
                );

            }

        },

        function(){

            falarTexto(
                "Não consegui acessar sua localização. Permita o acesso à localização."
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:300000
        }

    );

}


/* =========================
   INTERPRETAR CLIMA
========================= */

function interpretarClima(codigo){

    if(codigo === 0)
        return "o céu está limpo";

    if(
        codigo === 1 ||
        codigo === 2
    )
        return "o céu está parcialmente nublado";

    if(codigo === 3)
        return "o céu está nublado";

    if(
        codigo === 45 ||
        codigo === 48
    )
        return "há neblina";

    if(
        codigo >= 51 &&
        codigo <= 57
    )
        return "há garoa";

    if(
        codigo >= 61 &&
        codigo <= 67
    )
        return "está chovendo";

    if(
        codigo >= 71 &&
        codigo <= 77
    )
        return "há possibilidade de neve";

    if(
        codigo >= 80 &&
        codigo <= 82
    )
        return "há pancadas de chuva";

    if(
        codigo >= 95 &&
        codigo <= 99
    )
        return "há possibilidade de tempestade";

    return "as condições do tempo estão variáveis";

}


/* =========================
   BATERIA
========================= */

async function consultarBateria(){

    if(
        !navigator.getBattery
    ){

        falarTexto(
            "Este navegador não permite consultar a bateria."
        );

        return;

    }


    try{

        const bateria =
            await navigator.getBattery();


        const porcentagem =
            Math.round(
                bateria.level * 100
            );


        let texto =
            "A bateria está em " +
            porcentagem +
            " por cento.";


        if(bateria.charging){

            texto +=
                " O aparelho está carregando.";

        }else{

            texto +=
                " O aparelho não está carregando.";

        }


        falarTexto(texto);


    }catch(e){

        falarTexto(
            "Não consegui consultar a bateria."
        );

    }

}
