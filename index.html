<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>NEMIS AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#020609;
    color:#00eaff;
    font-family:Arial,sans-serif;
    height:100vh;
    overflow:hidden;
}

/* ==============================
   FUNDO
============================== */

body:before{
    content:"";
    position:fixed;
    inset:0;

    background:
      linear-gradient(
        rgba(0,234,255,.06) 1px,
        transparent 1px
      ),

      linear-gradient(
        90deg,
        rgba(0,234,255,.06) 1px,
        transparent 1px
      );

    background-size:35px 35px;

    animation:grid 10s linear infinite;

    pointer-events:none;
}

@keyframes grid{

    from{
        background-position:0 0;
    }

    to{
        background-position:35px 35px;
    }

}

/* ==============================
   CABEÇALHO
============================== */

header{
    position:relative;
    z-index:2;

    text-align:center;

    padding-top:22px;
}

.logo{

    font-size:34px;

    font-weight:bold;

    letter-spacing:9px;

    text-shadow:
      0 0 8px #00eaff,
      0 0 25px #00eaff,
      0 0 50px #00eaff;
}

.status{

    margin-top:8px;

    font-size:11px;

    letter-spacing:2px;

    min-height:14px;
}

/* ==============================
   NÚCLEO
============================== */

.coreArea{

    height:42vh;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    z-index:2;
}

.core{

    width:155px;

    height:155px;

    border-radius:50%;

    background:
      radial-gradient(
        circle,
        white 0%,
        #00eaff 8%,
        #008aa0 25%,
        #00333e 45%,
        transparent 70%
      );

    box-shadow:
      0 0 20px #00eaff,
      0 0 50px #00eaff,
      0 0 100px #006d80;

    animation:pulse 2s infinite;

    position:relative;
}

.core:before,
.core:after{

    content:"";

    position:absolute;

    border-radius:50%;

    border:2px solid #00eaff;
}

.core:before{

    inset:-25px;

    border-left-color:transparent;

    animation:rotate 5s linear infinite;
}

.core:after{

    inset:-45px;

    border-right-color:transparent;

    border-style:dashed;

    animation:rotateReverse 8s linear infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(.92);
    }

    50%{
        transform:scale(1.08);
    }

}

@keyframes rotate{

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateReverse{

    to{
        transform:rotate(-360deg);
    }

}

/* ==============================
   OUVINDO / FALANDO
============================== */

.listening .core{

    animation:pulseFast .4s infinite alternate;
}

@keyframes pulseFast{

    from{
        transform:scale(.9);
    }

    to{
        transform:scale(1.18);
    }

}

/* ==============================
   CHAT
============================== */

.chat{

    position:relative;

    z-index:3;

    height:22vh;

    overflow-y:auto;

    padding:10px 18px;
}

.msg{

    margin-bottom:9px;

    padding:10px 13px;

    border-left:2px solid #00eaff;

    background:rgba(0,234,255,.06);

    border-radius:5px;

    font-size:14px;

    word-wrap:break-word;
}

.user{

    color:white;

    border-left-color:white;
}

/* ==============================
   CONTROLES
============================== */

.controls{

    position:relative;

    z-index:4;

    display:flex;

    justify-content:center;

    gap:15px;
}

button{

    width:78px;

    height:78px;

    border-radius:50%;

    background:rgba(0,234,255,.08);

    border:2px solid #00eaff;

    color:#00eaff;

    font-size:30px;

    box-shadow:0 0 20px #00eaff;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

button:active{

    transform:scale(.92);
}

#stop{

    display:none;

    font-size:22px;
}

/* ==============================
   RODAPÉ
============================== */

footer{

    position:absolute;

    bottom:8px;

    width:100%;

    text-align:center;

    font-size:9px;

    opacity:.5;
}

</style>

</head>


<body>


<header>

    <div class="logo">
        NEMIS
    </div>

    <div class="status" id="status">
        SISTEMA ONLINE • AGUARDANDO COMANDO
    </div>

</header>


<div class="coreArea" id="coreArea">

    <div class="core"></div>

</div>


<div class="chat" id="chat">

    <div class="msg">
        NEMIS: Sistema iniciado. Estou online.
    </div>

</div>


<div class="controls">

    <button id="mic" type="button">
        🎙️
    </button>

    <button id="stop" type="button">
        ⏹️
    </button>

</div>


<footer>

    NEMIS ARTIFICIAL INTELLIGENCE SYSTEM

</footer>


<script>

/* =====================================
   ELEMENTOS
===================================== */

const chat =
    document.getElementById("chat");

const mic =
    document.getElementById("mic");

const stop =
    document.getElementById("stop");

const status =
    document.getElementById("status");

const coreArea =
    document.getElementById("coreArea");


/* =====================================
   RECONHECIMENTO DE VOZ
===================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let ouvindo = false;


/* =====================================
   VERIFICAR SUPORTE
===================================== */

if(!SpeechRecognition){

    status.innerText =
        "MICROFONE NÃO SUPORTADO NESTE NAVEGADOR";

    mic.disabled = true;

}else{

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "pt-BR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    /* ================================
       INÍCIO
    ================================= */

    recognition.onstart = function(){

        ouvindo = true;

        coreArea.classList.add(
            "listening"
        );

        status.innerText =
            "OUVINDO • FALE COMIGO";

        mic.style.display =
            "none";

        stop.style.display =
            "block";
    };


    /* ================================
       RESULTADO
    ================================= */

    recognition.onresult =
        function(event){

        const resultado =
            event.results[0][0].transcript;

        const comando =
            resultado.trim();

        if(!comando){

            return;
        }

        adicionarMensagem(
            "VOCÊ: " + comando,
            "user"
        );

        processar(
            comando.toLowerCase()
        );

    };


    /* ================================
       FIM
    ================================= */

    recognition.onend =
        function(){

        ouvindo = false;

        coreArea.classList.remove(
            "listening"
        );

        mic.style.display =
            "block";

        stop.style.display =
            "none";

        status.innerText =
            "SISTEMA ONLINE • AGUARDANDO COMANDO";
    };


    /* ================================
       ERROS
    ================================= */

    recognition.onerror =
        function(event){

        ouvindo = false;

        coreArea.classList.remove(
            "listening"
        );

        mic.style.display =
            "block";

        stop.style.display =
            "none";

        console.log(
            "Erro de voz:",
            event.error
        );


        if(event.error === "not-allowed"){

            status.innerText =
                "MICROFONE BLOQUEADO";

            falarTexto(
                "O acesso ao microfone foi bloqueado. Permita o microfone nas configurações."
            );

            return;
        }


        if(event.error === "no-speech"){

            status.innerText =
                "NÃO OUVI NADA";

            return;
        }


        if(event.error === "audio-capture"){

            status.innerText =
                "MICROFONE NÃO ENCONTRADO";

            return;
        }


        status.innerText =
            "ERRO NO MICROFONE";

    };

}


/* =====================================
   BOTÃO MICROFONE
===================================== */

mic.addEventListener(
    "click",
    function(){

        iniciarEscuta();

    }
);


/* =====================================
   INICIAR ESCUTA
===================================== */

function iniciarEscuta(){

    if(!recognition){

        falarTexto(
            "Seu navegador não suporta reconhecimento de voz."
        );

        return;
    }


    if(ouvindo){

        return;
    }


    try{

        recognition.start();

    }catch(error){

        console.log(
            "Erro ao iniciar:",
            error
        );

    }

}


/* =====================================
   BOTÃO PARAR
===================================== */

stop.addEventListener(
    "click",
    function(){

        if(
            recognition &&
            ouvindo
        ){

            recognition.stop();

        }

        window.speechSynthesis.cancel();

        coreArea.classList.remove(
            "listening"
        );

        status.innerText =
            "NEMIS EM SILÊNCIO";

    }
);


/* =====================================
   ADICIONAR MENSAGEM
===================================== */

function adicionarMensagem(
    texto,
    tipo
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "msg " + tipo;

    div.innerText =
        texto;

    chat.appendChild(
        div
    );

    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================
   VOZ DO NEMIS
===================================== */

function falarTexto(texto){

    adicionarMensagem(
        "NEMIS: " + texto,
        ""
    );


    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    window.speechSynthesis.cancel();


    const voz =
        new SpeechSynthesisUtterance(
            texto
        );


    voz.lang =
        "pt-BR";

    voz.rate =
        1.05;

    voz.pitch =
        0.85;


    const vozes =
        window.speechSynthesis
        .getVoices();


    const vozPortugues =
        vozes.find(
            function(v){

                return v.lang
                    .toLowerCase()
                    .startsWith("pt");

            }
        );


    if(vozPortugues){

        voz.voice =
            vozPortugues;

    }


    coreArea.classList.add(
        "listening"
    );


    voz.onend =
        function(){

        coreArea.classList.remove(
            "listening"
        );

    };


    window.speechSynthesis.speak(
        voz
    );

}


/* =====================================
   CARREGAR VOZ
===================================== */

if(
    "speechSynthesis" in window
){

    window.speechSynthesis
        .getVoices();

}


/* =====================================
   PROCESSADOR PRINCIPAL
===================================== */

function processar(c){

    /* ================================
       SAUDAÇÃO
    ================================= */

    if(
        c.includes("oi") ||
        c.includes("olá") ||
        c.includes("ola") ||
        c.includes("bom dia") ||
        c.includes("boa tarde") ||
        c.includes("boa noite")
    ){

        falarTexto(
            "Olá. NEMIS online. Pode mandar."
        );

        return;
    }


    /* ================================
       IDENTIDADE
    ================================= */

    if(
        c.includes("seu nome") ||
        c.includes("quem é você") ||
        c.includes("quem e voce")
    ){

        falarTexto(
            "Eu sou a NEMIS, sua assistente pessoal."
        );

        return;
    }


    /* ================================
       HORA
    ================================= */

    if(
        c.includes("hora") ||
        c.includes("horas") ||
        c.includes("que horas são") ||
        c.includes("que horas sao")
    ){

        const agora =
            new Date();


        const hora =
            agora.toLocaleTimeString(
                "pt-BR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );


        falarTexto(
            "Agora são " +
            hora +
            "."
        );

        return;
    }


    /* ================================
       DATA
    ================================= */

    if(
        c.includes("data") ||
        c.includes("dia de hoje") ||
        c.includes("que dia é hoje") ||
        c.includes("que dia e hoje") ||
        c.includes("hoje é que dia") ||
        c.includes("hoje e que dia")
    ){

        const hoje =
            new Date();


        const data =
            hoje.toLocaleDateString(
                "pt-BR",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            );


        falarTexto(
            "Hoje é " +
            data +
            "."
        );

        return;
    }


    /* ================================
       CLIMA
    ================================= */

    if(
        c.includes("clima") ||
        c.includes("tempo") ||
        c.includes("temperatura") ||
        c.includes("como está o tempo") ||
        c.includes("como esta o tempo") ||
        c.includes("vai chover") ||
        c.includes("previsão do tempo") ||
        c.includes("previsao do tempo")
    ){

        consultarClima();

        return;
    }


    /* ================================
       YOUTUBE
    ================================= */

    if(
        c.includes("youtube")
    ){

        falarTexto(
            "Abrindo o YouTube."
        );


        setTimeout(
            function(){

                window.open(
                    "https://www.youtube.com/",
                    "_blank"
                );

            },
            1000
        );

        return;
    }


    /* ================================
       GOOGLE
    ================================= */

    if(
        c.includes("google") ||
        c.includes("pesquise") ||
        c.includes("pesquisar") ||
        c.includes("procure")
    ){

        falarTexto(
            "Abrindo a pesquisa."
        );


        const pesquisa =
            encodeURIComponent(c);


        setTimeout(
            function(){

                window.open(
                    "https://www.google.com/search?q=" +
                    pesquisa,
                    "_blank"
                );

            },
            1000
        );

        return;
    }


    /* ================================
       SILÊNCIO
    ================================= */

    if(
        c.includes("pare") ||
        c.includes("parar") ||
        c.includes("silêncio") ||
        c.includes("silencio")
    ){

        window.speechSynthesis.cancel();

        status.innerText =
            "NEMIS EM SILÊNCIO";

        return;
    }


    /* ================================
       INTELIGÊNCIA
    ================================= */

    if(
        c.includes("você é inteligente") ||
        c.includes("voce e inteligente")
    ){

        falarTexto(
            "Estou ficando cada vez melhor."
        );

        return;
    }


    /* ================================
       BURRO
    ================================= */

    if(
        c.includes("você é burro") ||
        c.includes("voce e burro")
    ){

        falarTexto(
            "Não. Mas agradeço pela sinceridade."
        );

        return;
    }


    /* ================================
       COMANDO DESCONHECIDO
    ================================= */

    falarTexto(
        "Entendi o comando, mas essa função ainda não está instalada."
    );

}


/* =====================================
   CLIMA
===================================== */

async function consultarClima(){

    falarTexto(
        "Vou consultar o clima para você."
    );


    if(
        !navigator.geolocation
    ){

        falarTexto(
            "Seu navegador não oferece acesso à localização."
        );

        return;
    }


    navigator.geolocation.getCurrentPosition(

        async function(posicao){

            try{

                const latitude =
                    posicao.coords.latitude;

                const longitude =
                    posicao.coords.longitude;


                const url =
                    "https://api.open-meteo.com/v1/forecast" +

                    "?latitude=" +
                    latitude +

                    "&longitude=" +
                    longitude +

                    "&current=" +
                    "temperature_2m," +
                    "apparent_temperature," +
                    "weather_code," +
                    "wind_speed_10m," +
                    "relative_humidity_2m" +

                    "&temperature_unit=celsius" +

                    "&wind_speed_unit=kmh" +

                    "&timezone=auto";


                const resposta =
                    await fetch(url);


                if(!resposta.ok){

                    throw new Error(
                        "Erro na API"
                    );

                }


                const dados =
                    await resposta.json();


                const atual =
                    dados.current;


                const temperatura =
                    atual.temperature_2m;


                const sensacao =
                    atual.apparent_temperature;


                const umidade =
                    atual.relative_humidity_2m;


                const vento =
                    atual.wind_speed_10m;


                const codigo =
                    atual.weather_code;


                const descricao =
                    interpretarClima(
                        codigo
                    );


                const texto =

                    "Agora a temperatura é de " +

                    temperatura +

                    " graus. " +

                    descricao +

                    ". " +

                    "A sensação térmica é de " +

                    sensacao +

                    " graus. " +

                    "A umidade está em " +

                    umidade +

                    " por cento. " +

                    "O vento está a " +

                    vento +

                    " quilômetros por hora.";


                falarTexto(texto);


            }catch(erro){

                console.log(
                    "Erro clima:",
                    erro
                );


                falarTexto(
                    "Não consegui consultar o clima agora."
                );

            }

        },


        function(erro){

            console.log(
                "Localização:",
                erro
            );


            falarTexto(
                "Não consegui acessar sua localização. Permita o acesso à localização para que eu possa consultar o clima."
            );

        },

        {
            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:300000
        }

    );

}


/* =====================================
   INTERPRETAR CLIMA
===================================== */

function interpretarClima(codigo){

    if(codigo === 0){

        return "o céu está limpo";
    }


    if(
        codigo === 1 ||
        codigo === 2
    ){

        return "o céu está parcialmente nublado";
    }


    if(codigo === 3){

        return "o céu está nublado";
    }


    if(
        codigo === 45 ||
        codigo === 48
    ){

        return "há neblina";
    }


    if(
        codigo >= 51 &&
        codigo <= 57
    ){

        return "há garoa";
    }


    if(
        codigo >= 61 &&
        codigo <= 67
    ){

        return "está chovendo";
    }


    if(
        codigo >= 71 &&
        codigo <= 77
    ){

        return "há possibilidade de neve";
    }


    if(
        codigo >= 80 &&
        codigo <= 82
    ){

        return "há pancadas de chuva";
    }


    if(
        codigo >= 95 &&
        codigo <= 99
    ){

        return "há possibilidade de tempestade";
    }


    return "as condições do tempo estão variáveis";

}


/* =====================================
   MENSAGEM INICIAL
===================================== */

setTimeout(

    function(){

        falarTexto(
            "NEMIS online. Sistema pronto."
        );

    },

    800

);

</script>

</body>

</html>
